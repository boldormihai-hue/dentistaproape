name: Actualizare saptamanala dentisti
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ruleaza script
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python update_dentisti.py
      - name: Commit
        run: |
          git config user.name "Bot DentistaProape"
          git config user.email "bot@dentistaproape.com"
          git add dentistaproape/data/dentisti.json dentistaproape/data/photos/ || true
          git diff --staged --quiet || git commit -m "Auto-update $(date '+%Y-%m-%d')"
          git push || true
      - name: Deploy JSON pe Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dentistaproape/data/
          server-dir: public_html/data/
